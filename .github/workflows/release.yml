name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (例如 v1.0.0)'
        required: true
        type: string
      channel:
        description: '内网更新通道'
        required: false
        default: 'stable'
        type: string
      publish_base_url:
        description: '内网更新根地址，例如 https://intra.example.com/med-hermes/stable'
        required: false
        type: string
      release_notes:
        description: '写入 latest.json 的更新说明'
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write
    environment: TAURI_SIGNING_PRIVATE_KEY
    strategy:
      fail-fast: false
      matrix:
        # 升级 macos-latest 到 macos-14 (M1) 以获得更快的编译速度
        platform: [macos-14, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are typically used for signing on macOS
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Sccache Setup
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Install frontend dependencies
        run: yarn install

      - name: Build frontend
        run: yarn build
        env:
          VITE_LLM_BASE_URL: ${{ vars.VITE_LLM_BASE_URL }}
          VITE_LLM_MODEL: ${{ vars.VITE_LLM_MODEL }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_DASHSCOPE_API_KEY: ${{ secrets.VITE_DASHSCOPE_API_KEY }}

      - name: Debug signing key (Unix)
        if: matrix.platform != 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "=== TAURI_SIGNING_PRIVATE_KEY Debug ==="
          echo "Length: ${#TAURI_SIGNING_PRIVATE_KEY}"
          
          # 检查是否包含空格
          if [[ "$TAURI_SIGNING_PRIVATE_KEY" == *" "* ]]; then
            echo "⚠️ WARNING: Key contains SPACES!"
            echo "Space positions:"
            echo "$TAURI_SIGNING_PRIVATE_KEY" | grep -bo ' ' | head -5
          else
            echo "✓ No spaces found"
          fi
          
          # 检查是否包含换行
          linecount=$(echo "$TAURI_SIGNING_PRIVATE_KEY" | wc -l)
          echo "Line count: $linecount"
          
          # 显示前20个字符（安全，只是 base64 前缀）
          echo "First 20 chars: ${TAURI_SIGNING_PRIVATE_KEY:0:20}"
          
          # 显示最后10个字符
          echo "Last 10 chars: ${TAURI_SIGNING_PRIVATE_KEY: -10}"
          
          # 检查是否是有效的 base64
          if echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /dev/null 2>&1; then
            echo "✓ Valid base64 format"
          else
            echo "⚠️ WARNING: Invalid base64 format!"
          fi
          
          # 检查字符9位置
          echo "Character at position 9: '${TAURI_SIGNING_PRIVATE_KEY:8:1}' (ASCII: $(printf '%d' "'${TAURI_SIGNING_PRIVATE_KEY:8:1}"))"

      - name: Debug signing key (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          Write-Host "=== TAURI_SIGNING_PRIVATE_KEY Debug ==="
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          Write-Host "Length: $($key.Length)"
          
          # 检查是否包含空格
          if ($key -match ' ') {
            Write-Host "⚠️ WARNING: Key contains SPACES!"
            $spaceIndex = $key.IndexOf(' ')
            Write-Host "First space at position: $spaceIndex"
          } else {
            Write-Host "✓ No spaces found"
          }
          
          # 检查行数
          $lines = $key -split "`n"
          Write-Host "Line count: $($lines.Count)"
          
          # 显示前20个字符
          Write-Host "First 20 chars: $($key.Substring(0, [Math]::Min(20, $key.Length)))"
          
          # 显示最后10个字符
          if ($key.Length -gt 10) {
            Write-Host "Last 10 chars: $($key.Substring($key.Length - 10))"
          }
          
          # 检查字符9位置
          if ($key.Length -gt 8) {
            $char9 = $key[8]
            Write-Host "Character at position 9: '$char9' (ASCII: $([int][char]$char9))"
          }
          
          # 验证 base64
          try {
            $decoded = [System.Convert]::FromBase64String($key)
            Write-Host "✓ Valid base64 format"
          } catch {
            Write-Host "⚠️ WARNING: Invalid base64 format! Error: $_"
          }

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_LLM_BASE_URL: ${{ vars.VITE_LLM_BASE_URL }}
          VITE_LLM_MODEL: ${{ vars.VITE_LLM_MODEL }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_DASHSCOPE_API_KEY: ${{ secrets.VITE_DASHSCOPE_API_KEY }}
          # 启用 sccache
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-14' && '--target universal-apple-darwin' || '' }}

      - name: Prepare Windows intranet update bundle
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          PUBLISH_BASE_URL: ${{ github.event.inputs.publish_base_url || vars.INTRANET_UPDATE_BASE_URL }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: |
          if [[ -z "$PUBLISH_BASE_URL" ]]; then
            echo "INTRANET_UPDATE_BASE_URL is required. Set workflow input publish_base_url or repository variable INTRANET_UPDATE_BASE_URL."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          node scripts/package-windows-internal-update.mjs \
            --artifacts-dir src-tauri/target/release/bundle/nsis \
            --output-dir dist/intranet-update \
            --base-url "$PUBLISH_BASE_URL" \
            --version "$VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --notes "$RELEASE_NOTES"

      - name: Upload Windows intranet update artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-update-${{ github.event.inputs.tag || github.ref_name }}
          path: dist/intranet-update/**
          if-no-files-found: error
