name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (例如 v1.0.0)'
        required: true
        type: string
      channel:
        description: '内网更新通道'
        required: false
        default: 'production'
        type: string
      publish_base_url:
        description: '内网更新根地址，例如 https://intra.example.com/pcie/production'
        required: false
        type: string
      release_notes:
        description: '写入 latest.json 的更新说明'
        required: false
        type: string

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate main release lineage
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git fetch origin main --tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Formal releases must point to a commit on main."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Delete the stale draft or choose a new version; releases cannot be reused."
            exit 1
          fi
          PREVIOUS_TAG="$(gh release view --json tagName --jq '.tagName')"
          node scripts/release-preflight.mjs --tag "$RELEASE_TAG" --previous-version "$PREVIOUS_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: preflight
    permissions:
      contents: write
    environment: TAURI_SIGNING_PRIVATE_KEY
    strategy:
      fail-fast: true
      # Both platforms append assets to one draft release. Serial execution
      # prevents duplicate drafts and partially overwritten latest.json files.
      max-parallel: 1
      matrix:
        # 升级 macos-latest 到 macos-14 (M1) 以获得更快的编译速度
        platform: [macos-14, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are typically used for signing on macOS
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Sccache Setup
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust cache
        # v2 currently resolves to a Node 24 build that emits DEP0040
        # (`punycode`) noise during the post-job cache save hook.
        uses: swatinem/rust-cache@v2.8.2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Install frontend dependencies
        run: yarn install

      - name: Build frontend
        run: yarn build
        env:
          VITE_REGIONAL_BASE_URL: ${{ vars.VITE_REGIONAL_BASE_URL }}

      - name: Build the app
        # Keep this pinned: the floating v0 tag moved to node24 and can fail on
        # runners that do not provide that action runtime yet.
        uses: tauri-apps/tauri-action@v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_REGIONAL_BASE_URL: ${{ vars.VITE_REGIONAL_BASE_URL }}
          # 启用 sccache
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        with:
          tagName: ${{ needs.preflight.outputs.release_tag }}
          releaseName: '全医慧助（PCIE）v__VERSION__'
          releaseBody: '全医慧助（PCIE）/ Primary Care Intelligent Expert 桌面端发布版本。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-14' && '--target universal-apple-darwin' || '' }}

      - name: Prepare Windows intranet update bundle
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'production' }}
          PUBLISH_BASE_URL: ${{ github.event.inputs.publish_base_url || vars.INTRANET_UPDATE_BASE_URL }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: |
          if [[ -z "$PUBLISH_BASE_URL" ]]; then
            echo "INTRANET_UPDATE_BASE_URL is required. Set workflow input publish_base_url or repository variable INTRANET_UPDATE_BASE_URL."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          node scripts/package-windows-internal-update.mjs \
            --artifacts-dir src-tauri/target/release/bundle/msi \
            --output-dir dist/intranet-update \
            --base-url "$PUBLISH_BASE_URL" \
            --version "$VERSION" \
            --channel "$RELEASE_CHANNEL" \
            --notes "$RELEASE_NOTES"

      - name: Upload Windows intranet update artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-update-${{ needs.preflight.outputs.release_tag }}
          path: dist/intranet-update/**
          if-no-files-found: error

  publish:
    needs: [preflight, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release validation scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}

      - name: Download the complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --dir release-assets

      - name: Download the Windows intranet release bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-internal-update-${{ needs.preflight.outputs.release_tag }}
          path: intranet-assets

      - name: Verify updater artifacts and signatures
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/validate-release-assets.mjs \
            --assets-dir release-assets \
            --tag "$RELEASE_TAG" \
            --tauri-config src-tauri/tauri.conf.json \
            --minisign minisign
          node scripts/validate-release-assets.mjs \
            --assets-dir intranet-assets \
            --tag "$RELEASE_TAG" \
            --targets windows-x86_64 \
            --tauri-config src-tauri/tauri.conf.json \
            --minisign minisign

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
